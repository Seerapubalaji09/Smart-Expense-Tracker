<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="container header-inner">
      <div>
        <h1>Smart Expense Tracker</h1>
        <p class="tagline">Track your spending, stay within budget.</p>
      </div>
      <div class="month-picker">
        <label for="month-filter">Viewing month</label>
        <input type="month" id="month-filter" name="month-filter">
      </div>
    </div>
  </header>

  <noscript>
    <div class="noscript-message">This app needs JavaScript to work. Please enable JavaScript in your browser.</div>
  </noscript>

  <main class="container layout">

    <!-- ===== Summary ===== -->
    <section class="card summary-card" aria-labelledby="summary-heading">
      <h2 id="summary-heading">Summary</h2>

      <div id="budget-warning" role="alert" hidden></div>

      <dl class="summary-grid">
        <div class="summary-item">
          <dt>Monthly budget</dt>
          <dd><span id="budget-display">Not set</span></dd>
        </div>
        <div class="summary-item">
          <dt>Total expenses</dt>
          <dd><span id="total-expenses">₹0.00</span></dd>
        </div>
        <div class="summary-item">
          <dt>Remaining budget</dt>
          <dd><span id="remaining-budget">—</span></dd>
        </div>
      </dl>
    </section>

    <!-- ===== Budget form ===== -->
    <section class="card" aria-labelledby="budget-heading">
      <h2 id="budget-heading">Monthly budget</h2>
      <form id="budget-form" novalidate>
        <div class="field">
          <label for="budget-input">Budget amount (₹)</label>
          <div class="inline-row">
            <input type="number" id="budget-input" name="budget" step="0.01" min="0"
                   placeholder="e.g. 5000" inputmode="decimal" aria-describedby="budget-error">
            <button type="submit" id="budget-save-btn" class="btn btn-primary">Save budget</button>
          </div>
          <span id="budget-error" class="error-message"></span>
        </div>
      </form>
    </section>

    <!-- ===== Add expense form ===== -->
    <section class="card" aria-labelledby="add-heading">
      <h2 id="add-heading">Add expense</h2>
      <form id="expense-form" novalidate>
        <div class="form-grid">
          <div class="field field-wide">
            <label for="description-input">Description</label>
            <input type="text" id="description-input" name="description" maxlength="60"
                   placeholder="e.g. Lunch" autocomplete="off" aria-describedby="description-error">
            <span id="description-error" class="error-message"></span>
          </div>

          <div class="field">
            <label for="amount-input">Amount (₹)</label>
            <input type="number" id="amount-input" name="amount" step="0.01" min="0"
                   placeholder="0.00" inputmode="decimal" aria-describedby="amount-error">
            <span id="amount-error" class="error-message"></span>
          </div>

          <div class="field">
            <label for="category-select">Category</label>
            <select id="category-select" name="category" aria-describedby="category-error">
              <option value="">Select a category</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Education">Education</option>
              <option value="Others">Others</option>
            </select>
            <span id="category-error" class="error-message"></span>
          </div>

          <div class="field">
            <label for="date-input">Date</label>
            <input type="date" id="date-input" name="date" aria-describedby="date-error">
            <span id="date-error" class="error-message"></span>
          </div>
        </div>

        <button type="submit" id="add-expense-btn" class="btn btn-primary btn-block">Add expense</button>
      </form>
    </section>

    <!-- ===== Category breakdown ===== -->
    <section class="card" aria-labelledby="breakdown-heading">
      <h2 id="breakdown-heading">Category breakdown</h2>
      <div id="category-breakdown"></div>
      <!--
        Example of a row generated by app.js:
        <div class="breakdown-row cat-food" data-category="Food">
          <span class="breakdown-label">Food</span>
          <div class="breakdown-bar"><div class="breakdown-bar-fill" style="width: 42.5%"></div></div>
          <span class="breakdown-amount">₹12.50</span>
          <span class="breakdown-percent">42.5%</span>
        </div>
      -->
    </section>

    <!-- ===== Transactions ===== -->
    <section class="card card-wide" aria-labelledby="list-heading">
      <h2 id="list-heading">Transactions</h2>
      <ul id="expense-list" class="expense-list"></ul>
      <p id="empty-message" class="empty-message" hidden>No expenses for this month.</p>
      <!--
        Example of a row generated by app.js:
        <li class="expense-item cat-food" data-id="exp_1700000000000_ab12">
          <div class="expense-desc">Lunch</div>
          <div class="expense-meta">
            <span class="expense-category">Food</span>
            <span class="expense-date">2026-11-25</span>
          </div>
          <div class="expense-amount">₹12.50</div>
          <button type="button" class="delete-btn" data-id="exp_1700000000000_ab12"
                  aria-label="Delete expense: Lunch">Delete</button>
        </li>
      -->
    </section>

  </main>

  <footer class="app-footer">
    <p>Your data is stored only in this browser.</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
